name: shatibiyyah
description: "متن الشاطبية — حِرز الأماني ووجه التهاني"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  path: ^1.9.1
  lucide_icons_flutter: ^3.1.20
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  crypto: ^3.0.7
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  in_app_review: ^2.0.12
  in_app_update: ^5.0.0
  background_downloader: ^9.5.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/pages/

  fonts:
    # --ff-naskh: "Scheherazade New" — verse text, chapter names, medallion number, chips
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ScheherazadeNew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    # The interface face the type roles name (tokens.g.dart, TzFont.ui). Item 3.2 bundles
    # IBM Plex Sans Arabic under this name; until then the roles draw with Reem Kufi.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
